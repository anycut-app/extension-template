<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Extension</title>
  </head>
  <body>
    <main style="max-width: 640px; margin: 0 auto; padding: 28px; display: flex; flex-direction: column; gap: 14px">
      <h1>My Extension</h1>
      <p class="muted">A starting point. Edit <code>ui/</code> for this page and <code>extension.mjs</code> for the Node side.</p>
      <div class="card col">
        <h3>Timeline</h3>
        <div id="timeline" class="mono">Waiting…</div>
        <div class="row">
          <button id="frame">Grab frame</button>
          <button id="ping" class="primary">Ping my code</button>
          <span id="pong" class="muted"></span>
        </div>
        <img id="img" alt="" style="max-width: 100%; border-radius: 8px" hidden />
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
